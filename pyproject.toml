[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypersearch"
version = "0.4.0"
description = "Evidence-first research harness with bounded mathematical discovery"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
hypersearch = "hypersearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
